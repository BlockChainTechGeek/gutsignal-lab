[project]
name = "gutsignal-lab"
version = "0.1.0"
description = "Reproducible bowel-sound event detection and explanation sprint"
requires-python = ">=3.12"
dependencies = [
  "joblib>=1.4",
  "kagglehub>=0.3",
  "librosa>=0.11",
  "matplotlib>=3.10",
  "numpy>=2.2",
  "pandas>=2.2",
  "plotly>=6.0",
  "scikit-learn>=1.7",
  "scipy>=1.15",
  "soundfile>=0.13",
  "streamlit>=1.48",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gutsignal"]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
